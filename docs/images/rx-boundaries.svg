<text x="28" y="282" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">应用 / 采集文件</text>
<text x="28" y="299" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="11" font-weight="400" fill="#8a8984" text-anchor="start">起始头已剥离</text>
