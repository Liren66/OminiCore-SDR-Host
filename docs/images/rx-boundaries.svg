<text x="166" y="388" font-family="'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="12" font-weight="500" fill="#52514e" text-anchor="start">{"type":"capture", "format":"sc16", "config":{…}, "hardware_timestamps":false}</text>
