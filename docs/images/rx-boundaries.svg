<text x="350" y="282" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#184f95" text-anchor="middle">epoch 1</text>
<text x="350" y="298" font-family="'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">flags: START | TIME_UNKNOWN</text>
