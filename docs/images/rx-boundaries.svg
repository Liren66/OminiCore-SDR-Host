<text x="645.0" y="143" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="11" font-weight="400" fill="#cfcdc6" text-anchor="middle">16 KiB</text>
