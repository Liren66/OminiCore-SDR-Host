<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">运行中改参</title><desc id="d">设备协调器在不销毁流句柄的情况下暂停、改参并恢复 RX/TX</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#52514e"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#2a78d6"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#eb6834"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#8a8984"/></marker><marker id="a-aqua" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#1baf7a"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 Z" fill="#6250d6"/></marker></defs><rect x="0.5" y="0.5" width="999" height="499" rx="14" fill="#fcfcfb" stroke="#e4e3df"/><text x="28" y="42" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="start">运行中改参：暂停 → 应用 → 恢复</text>
<text x="28" y="66" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">管理线程调用 configure / set_fir / set_sample_rate 等接口；流句柄和已分配缓冲保持不变</text>
<polygon points="150.0,96 302.4,96 314.4,122 302.4,148 150.0,148" fill="#eaf2fd" stroke="#9ec5f4"/>
<text x="236.2" y="118" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#184f95" text-anchor="middle">1  校验请求</text>
<text x="236.2" y="136" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">同参数直接返回</text>
<polygon points="314.4,96 466.79999999999995,96 478.79999999999995,122 466.79999999999995,148 314.4,148 326.4,122" fill="#eaf2fd" stroke="#9ec5f4"/>
<text x="400.59999999999997" y="118" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#184f95" text-anchor="middle">2  暂停</text>
<text x="400.59999999999997" y="136" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">唤醒阻塞的读写</text>
<polygon points="478.8,96 631.2,96 643.2,122 631.2,148 478.8,148 490.8,122" fill="#eaf2fd" stroke="#9ec5f4"/>
<text x="565.0" y="118" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#184f95" text-anchor="middle">3  清理会话</text>
<text x="565.0" y="136" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">取消旧 USB 请求</text>
<polygon points="643.2,96 795.6,96 807.6,122 795.6,148 643.2,148 655.2,122" fill="#efedfb" stroke="#b9b1ef"/>
<text x="729.4000000000001" y="118" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#3f2fa3" text-anchor="middle">4  写入参数</text>
<text x="729.4000000000001" y="136" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">只下发变化项</text>
<polygon points="807.6,96 960.0,96 972.0,122 960.0,148 807.6,148 819.6,122" fill="#eaf2fd" stroke="#9ec5f4"/>
<text x="893.8000000000001" y="118" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#184f95" text-anchor="middle">5  恢复</text>
<text x="893.8000000000001" y="136" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">RX 先启动，TX 后启动</text>
<text x="28" y="126" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">管理线程</text>
<pattern id="h2" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f3f2ef"/><line x1="0" y1="0" x2="0" y2="8" stroke="#8a8984" stroke-width="1.5"/></pattern>
<text x="28" y="204" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">RX 流</text>
<text x="28" y="221" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="11" font-weight="400" fill="#8a8984" text-anchor="start">同一句柄</text>
<rect x="150" y="184" width="166.39999999999998" height="46" rx="6" fill="#eaf2fd" stroke="#9ec5f4" stroke-width="1"/>
<text x="235.2" y="204" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#184f95" text-anchor="middle">epoch N</text>
<text x="235.2" y="220" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">正常收样</text>
<rect x="320.4" y="184" width="477.20000000000005" height="46" rx="6" fill="url(#h2)" stroke="#cfcdc6" stroke-width="1"/>
<rect x="395.4" y="196" width="250" height="22" rx="4" fill="#fcfcfb"/>
<text x="520.4" y="212" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#52514e" text-anchor="middle">暂停窗口：旧队列丢弃，丢样属预期</text>
<rect x="801.6" y="184" width="170.39999999999998" height="46" rx="6" fill="#eaf2fd" stroke="#9ec5f4" stroke-width="1"/>
<text x="886.8" y="204" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#184f95" text-anchor="middle">epoch N+1</text>
<text x="886.8" y="220" font-family="'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">RECONFIGURED</text>
<text x="28" y="272" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">TX 流</text>
<text x="28" y="289" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="11" font-weight="400" fill="#8a8984" text-anchor="start">同一句柄</text>
<rect x="150" y="252" width="166.39999999999998" height="46" rx="6" fill="#fdeee7" stroke="#f3b49a" stroke-width="1"/>
<text x="235.2" y="272" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#a8431b" text-anchor="middle">应用数据</text>
<text x="235.2" y="288" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">正常发射</text>
<rect x="320.4" y="252" width="477.20000000000005" height="46" rx="6" fill="url(#h2)" stroke="#cfcdc6" stroke-width="1"/>
<rect x="395.4" y="264" width="250" height="22" rx="4" fill="#fcfcfb"/>
<text x="520.4" y="280" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#52514e" text-anchor="middle">暂停窗口：旧排队数据丢弃</text>
<rect x="801.6" y="252" width="86" height="46" rx="6" fill="#ffffff" stroke="#f3b49a" stroke-width="1"/>
<text x="844.6" y="272" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="12" font-weight="700" fill="#a8431b" text-anchor="middle">零 IQ × 4 块</text>
<text x="844.6" y="288" font-family="'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">tx_padding</text>
<rect x="891.6" y="252" width="80.39999999999998" height="46" rx="6" fill="#fdeee7" stroke="#f3b49a" stroke-width="1"/>
<text x="931.8" y="280" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#a8431b" text-anchor="middle">新数据</text>
<text x="28" y="340" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">应用 IO 线程</text>
<text x="28" y="357" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="11" font-weight="400" fill="#8a8984" text-anchor="start">recv / send</text>
<rect x="150" y="320" width="822" height="46" rx="6" fill="#ffffff" stroke="#cfcdc6" stroke-width="1"/>
<text x="166" y="340" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="12" font-weight="500" fill="#0b0b0b" text-anchor="start">暂停期间 recv / acquire / send 以 OCH_TIMEOUT 返回，重试即可；已部分接受的 send 返回 OK</text>
<text x="166" y="357" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">持有 RX 租借时改参返回 OCH_BUSY，硬件保持不变；有流时不能改变通道 mask 或 USB IQ 位数</text>
<rect x="150" y="392" width="822" height="82" rx="8" fill="#fff7f4" stroke="#f3b49a" stroke-width="1"/>
<text x="166" y="416" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#a8431b" text-anchor="start">失败处理</text>
<text x="166" y="438" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">任一步骤失败：停止 RX 与 TX，配置缓存失效。应用保存错误、结束 IO 线程并销毁旧流，</text>
<text x="166" y="458" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="12" font-weight="400" fill="#0b0b0b" text-anchor="start">确认设备状态后重新 configure、创建并启动流。核心不会自动回滚，也不会自行启动发射。</text>
<text x="28" y="438" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">异常</text>
<line x1="320.4" y1="150" x2="320.4" y2="302" stroke="#8a8984" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
<line x1="797.6" y1="150" x2="797.6" y2="302" stroke="#8a8984" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/></svg>
